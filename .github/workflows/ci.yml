name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: minicode

      # minicore di-vendor ke minicode/vendor/minicore (lihat scripts/vendor-minicore.ts),
      # jadi `bun install` TIDAK lagi butuh sibling. Checkout ini hanya untuk
      # memverifikasi vendor masih sinkron dengan sumbernya + menjalankan test kernel.
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: startupmini/minicore
          path: minicore

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: minicode/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('minicode/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        working-directory: minicode
        run: bun install

      # Gate distribusi: vendor tidak boleh tertinggal dari ../minicore.
      # Bila checkout minicore gagal (repo privat), script lolos dengan pesan.
      - name: Vendor sync check
        working-directory: minicode
        run: bun run vendor:check

      - name: Typecheck
        working-directory: minicode
        run: bun x tsc --noEmit

      - name: Lint (biome)
        working-directory: minicode
        run: bun run lint

      - name: Test
        working-directory: minicode
        run: bun test

      # Gate agregat nyata. `bun test --coverage` sendirian selalu lulus —
      # threshold Bun dievaluasi per-file sehingga tak bisa dipakai sebagai gate.
      - name: Coverage gate (aggregate)
        working-directory: minicode
        run: bun run gate:coverage

      # grep punya dua jalur (ripgrep + fallback walker). CI runner punya rg,
      # jadi jalur fallback juga diuji eksplisit agar tak diam-diam rusak.
      - name: Test with JS grep engine (fallback path)
        working-directory: minicode
        env:
          MINICODE_GREP_ENGINE: js
        run: bun test test/phase1-tools.test.ts test/tools.test.ts

      # Gate keamanan: korpus 62 pola serangan + 24 perintah sah (sumber angka:
      # experiments/bash-bypass-probe.ts). Exit 1 bila ada bypass ATAU
      # over-block, jadi regresi ke dua arah tertangkap.
      - name: Bash bypass probe (auto)
        working-directory: minicode
        run: bun experiments/bash-bypass-probe.ts

      - name: Bash bypass probe (allowlist)
        working-directory: minicode
        run: bun experiments/bash-bypass-probe.ts --mode allowlist

      # Eksperimen ekstrem (fuzz multi-seed + stress + adversarial + docker)
      # PINDAH ke slow.yml (nightly + manual): stokastik/fluktuatif antar run,
      # kegagalannya sinyal investigasi bukan penolakan PR. Di sini cukup
      # korpus deterministik di atas + smoke + audit harness.
      # Gate distribusi: tarball harus memuat semua yang dibutuhkan runtime dan
      # tidak memuat rahasia. Kegagalan `files` hanya terlihat setelah publish
      # kalau tidak diperiksa di sini.
      - name: Pack check (npm tarball)
        working-directory: minicode
        run: bun run gate:pack

      - name: Benchmark smoke (fake provider)
        working-directory: minicode
        run: bun run bench:smoke

      # Audit harness deterministik (tanpa API key): safety/guard/jail/budget.
      - name: Harness audit (60 checks)
        working-directory: minicode
        run: bun run audit:harness

      - name: Telemetry gate (resolve rate target)
        working-directory: minicode
        run: bun run gate:telemetry

      - name: Test minicore
        working-directory: minicore
        continue-on-error: true
        run: bun test

  # Web SSG: build + checker (link, anchor, sitemap, SEO, anti-rahasia).
  # Dulu hanya jalan di push main (web.yml) — PR yang merusak link baru
  # ketahuan SETELAH merge. Tanpa deploy (itu tetap tugas web.yml).
  web-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install
      - name: Build web
        run: bun run web:build
      - name: Check web
        run: bun run web:check

  # Smoke Windows (temuan audit F2): jalur khusus Windows — pelepasan caret dan
  # %VAR% cmd.exe, junction/symlink owned-state, fsutil/mklink/hardlink, jail
  # path case-insensitive — TIDAK PERNAH dilihat job ubuntu, sehingga regresinya
  # dulu hanya ketahuan di mesin dev (dan probe PTY/ConPTY di sebagian mesin
  # Windows memang rusak; lihat test/helpers/pty-harness.ts).
  # Suite penuh tetap milik job ubuntu; di sini subset yang menyentuh jalur
  # Windows (terverifikasi hijau di Windows: 337 pass / 3 skip / 0 fail, ~4 dtk).
  ci-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Typecheck
        run: bun x tsc --noEmit
      - name: Lint (biome)
        run: bun run lint
      - name: Test jalur Windows (guard cmd.exe, jail, permission, tool, render)
        run: >-
          bun test test/bash-guard-escaping.test.ts test/phase2-security.test.ts
          test/permission-matrix.test.ts test/deny-reason.test.ts
          test/jail-realpath.test.ts test/safe-open.test.ts test/tool-toctou.test.ts
          test/width.test.ts test/sanitize.test.ts test/tui-geometry.test.ts
          test/cli-subcommands.test.ts
      - name: Bash bypass probe (auto)
        run: bun experiments/bash-bypass-probe.ts
      - name: Pack check (npm tarball)
        run: bun run gate:pack
