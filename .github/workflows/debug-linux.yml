name: Debug Linux Test

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install
        run: bun install
      - name: Run full coverage (capture to file, don't fail)
        shell: bash
        run: |
          bun test --coverage --reporter dot > /tmp/full.txt 2>&1 || true
          echo "=== captured, lines: $(wc -l < /tmp/full.txt) ==="
      - name: Show failure details
        shell: bash
        run: |
          echo "=== (fail) lines ==="
          grep -n "(fail)" /tmp/full.txt || echo "(none)"
          echo "=== context around chain 4 / delegation / toBe / toMatch ==="
          grep -n -i -A 25 -B 3 "chain 4\|delegasi nyata\|childSessionId\|write_file.*committed\|jurnal menautkan" /tmp/full.txt | head -120 || echo "(no match)"