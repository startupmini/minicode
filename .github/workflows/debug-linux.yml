name: Debug Linux Test

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install
        run: bun install
      - name: Run full coverage (default reporter, capture failure detail)
        shell: bash
        run: |
          bun test --coverage 2>&1 | tee /tmp/full.txt | tail -40
      - name: Show chain 4 failure detail
        shell: bash
        run: |
          echo "=== looking for chain 4 ==="
          grep -n -A 40 "chain 4" /tmp/full.txt || echo "(chain 4 not found in log)"