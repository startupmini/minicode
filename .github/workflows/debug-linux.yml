name: Debug Linux Test

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install
        run: bun install
      - name: Run full coverage (capture, don't fail)
        shell: bash
        run: |
          bun test --coverage --reporter dot > /tmp/full.txt 2>&1 || true
          echo "captured $(wc -l < /tmp/full.txt) lines"
      - name: Show failure context
        shell: bash
        run: |
          echo "==== (fail) markers ===="
          grep -n "(fail)" /tmp/full.txt || echo "(none)"
          echo "==== 60 lines before each (fail) — full assertion ===="
          awk '/\(fail\)/{print "\n------ FAIL @" NR " ------\n"; for(i=NR-60;i<NR;i++) if(i>0) print i ":" lines[i]; print $0; next} {lines[NR]=$0}' /tmp/full.txt