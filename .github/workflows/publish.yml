name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require version tag ref
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" != "tag" || ! "${GITHUB_REF}" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Publish requires a semantic-version v* tag; refusing ${GITHUB_REF}"
            exit 1
          fi
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [[ "${GITHUB_REF}" != "refs/tags/v${PKG_VERSION}" ]]; then
            echo "Tag ${GITHUB_REF#refs/tags/v} != package.json ${PKG_VERSION} — abort"
            exit 1
          fi
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Install
        run: bun install --frozen-lockfile
      - name: Vendor check
        run: bun run vendor:check
      - name: Typecheck
        run: bun x tsc --noEmit
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun test
      - name: Coverage gate
        run: bun run gate:coverage
      - name: Pack check
        run: bun run gate:pack
      - name: Harness evaluation
        run: bun run audit:harness
      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
