name: Slow gates (nightly)

# F4.2: gerbang lambat/stokastik terpisah dari CI per-commit. Docker
# fluktuatif antar run — kegagalannya sinyal investigasi, bukan penolakan PR.
# Ambang coverage dikunci ke suite cepat (`bun test` di ci.yml), bukan ke sini.
#
# Catatan: harness eksperimen ekstrem (fuzz bash-guard, stress shadow-git,
# MCP adversarial) di `experiments/extreme-*.ts` sudah tidak ada di repo, jadi
# job-nya dihapus. Korpus bash-guard deterministik tetap dijaga `gate:bash`
# (experiments/bash-bypass-probe.ts) di ci.yml.
on:
  schedule:
    - cron: "0 18 * * *" # 01:00 WIB
  workflow_dispatch:

jobs:
  slow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: minicode

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: minicode
        run: bun install

      - name: Test with docker sandbox (experimental)
        working-directory: minicode
        continue-on-error: true
        run: |
          MINICODE_SANDBOX=docker bun test
