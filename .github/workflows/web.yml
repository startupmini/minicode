name: Web

on:
  push:
    branches: [main]
    paths:
      - web/**
      - content/**
      - docs/*.md
      - docs/SUMMARY.md
      - scripts/build-web*.ts
      - scripts/web/**
      - scripts/web-check.ts
      - package.json
  workflow_dispatch:
  # Mingguan: submit sitemap ke IndexNow walau tanpa deploy. Schedule
  # mengabaikan filter `paths` (berlaku push saja) — job build/deploy
  # di-skip lewat `if` di bawah, hanya indexnow yang jalan.
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install
      - name: Build web
        run: bun run web:build
      - name: Check web
        run: bun run web:check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    if: github.event_name != 'schedule'
    # Concurrency di job deploy (bukan level workflow): run terjadwal yang
    # deploy-nya di-skip tidak ikut grup ini, jadi jadwal mingguan tak
    # mungkin membatalkan deploy push yang sedang berjalan.
    concurrency:
      group: pages
      cancel-in-progress: true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  # Submit sitemap ke IndexNow (Bing/Yandex/Seznam) tiap selesai deploy —
  # pengganti ping sitemap Google/Bing yang sudah mati (2025). `needs: deploy`
  # bukan sekadar urutan: protokol IndexNow memvalidasi GET /<key>.txt di
  # host, jadi submit hanya valid setelah artifact benar-benar live (script
  # mem-preflight itu sendiri). URL sama dikirim ulang aman — IndexNow
  # mendebounce. web:build butuh nol dependensi npm, jadi tanpa `bun install`.
  indexnow:
    needs: deploy
    # Tanpa ini, deploy yang di-skip (jadwal) akan menykip indexnow juga
    # via rantai needs. Jalan bila deploy sukses (push/dispatch) ATAU
    # di-skip (jadwal); deploy gagal/cancelled → tetap skip. (!cancelled(),
    # bukan always(), agar run yang dibatalkan tak melanjutkan submit.)
    if: ${{ !cancelled() && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Build web
        run: bun run web:build
      - name: Submit sitemap ke IndexNow
        run: bun run web:indexnow
