name: Web

on:
  push:
    branches: [main]
    paths:
      - web/**
      - content/**
      - docs/*.md
      - docs/SUMMARY.md
      - scripts/build-web*.ts
      - scripts/web/**
      - scripts/web-check.ts
      - package.json
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install
      - name: Build web
        run: bun run web:build
      - name: Check web
        run: bun run web:check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  # Submit sitemap ke IndexNow (Bing/Yandex/Seznam) tiap selesai deploy —
  # pengganti ping sitemap Google/Bing yang sudah mati (2025). `needs: deploy`
  # bukan sekadar urutan: protokol IndexNow memvalidasi GET /<key>.txt di
  # host, jadi submit hanya valid setelah artifact benar-benar live (script
  # mem-preflight itu sendiri). URL sama dikirim ulang aman — IndexNow
  # mendebounce. web:build butuh nol dependensi npm, jadi tanpa `bun install`.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Build web
        run: bun run web:build
      - name: Submit sitemap ke IndexNow
        run: bun run web:indexnow
